<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Mission Control</title>
    <!-- Include external questions file -->
    <script src="questions.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(15, 23, 42, 0.85);
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: var(--card-bg);
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 25px var(--accent-glow);
            border-radius: 16px;
            padding: 30px;
            box-sizing: border-box;
            position: relative;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .mission-title {
            font-size: 1.25rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer-container {
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .streak-badge {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            display: none;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .question-box {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 25px;
            min-height: 90px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            font-size: 1.1rem;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .mcq-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .mcq-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 14px 18px;
            text-align: left;
            border-radius: 10px;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mcq-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-color);
        }

        .btn-primary {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 14px 24px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
        }

        .btn-primary:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .hint-box {
            background: rgba(234, 179, 8, 0.15);
            border: 2px dashed #facc15;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #fef08a;
            display: none;
        }

        .explanation-box {
            background: rgba(34, 197, 94, 0.15);
            border: 2px solid #4ade80;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #bbf7d0;
            display: none;
        }

        /* Scorecard Grid Styles */
        .scorecard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
            gap: 8px;
            margin: 20px 0;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .grid-item {
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .grid-item:hover {
            transform: scale(1.1);
        }

        .grid-correct { background-color: rgba(34, 197, 94, 0.4); border-color: #22c55e; color: #dcfce7; }
        .grid-wrong { background-color: rgba(239, 68, 68, 0.4); border-color: #ef4444; color: #fee2e2; }
        .grid-unanswered { background-color: rgba(100, 116, 139, 0.4); border-color: #64748b; color: #f1f5f9; }

        /* Snapshot Table Styles */
        .snapshot-container {
            max-height: 250px;
            overflow-y: auto;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            text-align: left;
        }

        .snapshot-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .snapshot-table th, .snapshot-table td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .snapshot-table th {
            background: rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
        }

        /* Canvas Particle Overlay */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="container" id="app-container">
        <div class="header-bar">
            <div class="mission-title" id="mission-title-text">🚀 Loading Mission...</div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div class="streak-badge" id="streak-badge">🔥 <span id="streak-count">0</span> Streak</div>
                <div class="timer-container">⏳ <span id="global-timer">00:00</span></div>
            </div>
        </div>

        <div id="quiz-view">
            <div style="font-size: 0.85rem; opacity: 0.7; margin-bottom: 10px;" id="progress-indicator">Question 1 of 35</div>
            <div class="question-box" id="question-text">Loading question data...</div>
            
            <div class="hint-box" id="hint-box"></div>
            <div class="explanation-box" id="explanation-box"></div>

            <div id="answer-area"></div>
            <button class="btn-primary" id="submit-btn" onclick="submitAnswer()" style="width: 100%;">Submit Answer</button>
        </div>

        <div id="scorecard-view" style="display: none; text-align: center;">
            <h2 style="margin-top: 0;">🎯 Mission Debrief & Scorecard</h2>
            <div id="badge-container" style="font-size: 2.5rem; margin: 10px 0;">🏅</div>
            <div id="rank-title" style="font-size: 1.2rem; font-weight: bold; color: var(--accent-color); margin-bottom: 10px;"></div>
            <p id="score-summary" style="font-size: 1.1rem; margin-bottom: 10px;"></p>
            <p id="motivational-message" style="font-style: italic; opacity: 0.9; margin-bottom: 20px; font-size: 0.95rem;"></p>

            <h4 style="margin-bottom: 5px; text-align: left;">Question Breakdown Grid (Click to Review):</h4>
            <div class="scorecard-grid" id="scorecard-grid"></div>

            <h4 style="margin-bottom: 5px; text-align: left; margin-top: 20px;">Parent Progress Snapshot Log:</h4>
            <div class="snapshot-container">
                <table class="snapshot-table" id="snapshot-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Question</th>
                            <th>Your Answer</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="snapshot-tbody">
                        <!-- Populated dynamically -->
                    </tbody>
                </table>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button class="btn-primary" onclick="startRetryMode()" id="retry-btn" style="flex: 1; display: none;">Review Missed Questions</button>
                <button class="btn-primary" onclick="restartMission()" style="flex: 1; background: #64748b; color: #fff;">Restart Mission</button>
            </div>
        </div>
    </div>

    <script>
        // --- Web Audio API Synth Generator ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'incorrect') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(140, now + 0.2);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'fanfare') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(freq, now + idx * 0.12);
                    g.gain.setValueAtTime(0.15, now + idx * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.3);
                    o.start(now + idx * 0.12);
                    o.stop(now + idx * 0.12 + 0.3);
                });
            }
        }

        // --- Particle Engine ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerBurst(iconSymbol) {
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12 - 4,
                    alpha: 1,
                    symbol: iconSymbol || (typeof missionConfig !== 'undefined' ? missionConfig.themeIcon : '⭐'),
                    size: Math.floor(Math.random() * 16) + 16
                });
            }
        }

        function updateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // gravity
                p.alpha -= 0.015;
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.font = `${p.size}px sans-serif`;
                    ctx.fillText(p.symbol, p.x, p.y);
                    ctx.restore();
                }
            });
            requestAnimationFrame(updateParticles);
        }
        updateParticles();

        // --- Core Application State ---
        let questions = [];
        let currentIdx = 0;
        let userResponses = {}; // questionIndex -> { answer, correct }
        let streak = 0;
        let globalSeconds = 0;
        let timerInterval = null;
        let isReviewMode = false;
        let reviewQueue = [];
        let reviewQueueIdx = 0;

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof missionConfig !== 'undefined') {
                document.getElementById('mission-title-text').innerText = missionConfig.themeTitle;
                if (missionConfig.themeColor) {
                    document.body.style.setProperty('background', missionConfig.themeColor, 'important');
                }
                questions = missionConfig.questions || [];
            } else {
                document.getElementById('mission-title-text').innerText = "🚀 Mission Loaded (Default)";
                questions = [
                    { type: "text", question: "What is 5 + 5?", answer: "10", hint: "Count on your fingers from 5!", explanation: "5 + 5 = 10." }
                ];
            }

            startGlobalTimer();
            loadQuestion();
        });

        function startGlobalTimer() {
            timerInterval = setInterval(() => {
                globalSeconds++;
                let mins = Math.floor(globalSeconds / 60).toString().padStart(2, '0');
                let secs = (globalSeconds % 60).toString().padStart(2, '0');
                document.getElementById('global-timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function loadQuestion() {
            let q;
            let displayNum;

            if (isReviewMode) {
                if (reviewQueueIdx >= reviewQueue.length) {
                    showScorecard();
                    return;
                }
                currentIdx = reviewQueue[reviewQueueIdx];
                q = questions[currentIdx];
                displayNum = `Review (${reviewQueueIdx + 1}/${reviewQueue.length})`;
            } else {
                if (currentIdx >= questions.length) {
                    showScorecard();
                    return;
                }
                q = questions[currentIdx];
                displayNum = `Question ${currentIdx + 1} of ${questions.length}`;
            }

            document.getElementById('progress-indicator').innerText = displayNum;
            document.getElementById('question-text').innerHTML = q.question;
            
            const hintBox = document.getElementById('hint-box');
            const explanationBox = document.getElementById('explanation-box');
            hintBox.style.display = 'none';
            explanationBox.style.display = 'none';

            if (isReviewMode) {
                if (q.hint) {
                    hintBox.innerHTML = `💡 <b>Hint:</b> ${q.hint}`;
                    hintBox.style.display = 'block';
                }
            }

            const answerArea = document.getElementById('answer-area');
            answerArea.innerHTML = '';

            if (q.type === 'mcq') {
                let mcqContainer = document.createElement('div');
                mcqContainer.className = 'mcq-options';
                q.options.forEach(opt => {
                    let btn = document.createElement('button');
                    btn.className = 'mcq-btn';
                    btn.innerText = opt;
                    btn.onclick = () => {
                        document.querySelectorAll('.mcq-btn').forEach(b => b.style.borderColor = 'rgba(255,255,255,0.15)');
                        btn.style.borderColor = 'var(--accent-color)';
                        window.selectedOption = opt;
                    };
                    mcqContainer.appendChild(btn);
                });
                answerArea.appendChild(mcqContainer);
                window.selectedOption = null;
            } else {
                let input = document.createElement('input');
                input.type = 'text';
                input.id = 'text-answer-input';
                input.placeholder = 'Type your answer here...';
                input.onkeydown = (e) => { if (e.key === 'Enter') submitAnswer(); };
                answerArea.appendChild(input);
                setTimeout(() => input.focus(), 100);
            }
        }

        function submitAnswer() {
            let q = questions[currentIdx];
            let userAns = "";

            if (q.type === 'mcq') {
                userAns = window.selectedOption || "";
            } else {
                let inp = document.getElementById('text-answer-input');
                userAns = inp ? inp.value.trim() : "";
            }

            if (!userAns) {
                alert("Please provide an answer before submitting!");
                return;
            }

            let isCorrect = (userAns.toLowerCase() === q.answer.toLowerCase());

            if (isCorrect) {
                playSound('correct');
                streak++;
                triggerBurst(typeof missionConfig !== 'undefined' ? missionConfig.themeIcon : '⭐');
                updateStreakDisplay();

                userResponses[currentIdx] = { answer: userAns, correct: true };

                if (isReviewMode) {
                    reviewQueueIdx++;
                    loadQuestion();
                } else {
                    currentIdx++;
                    loadQuestion();
                }
            } else {
                playSound('incorrect');
                streak = 0;
                updateStreakDisplay();

                userResponses[currentIdx] = { answer: userAns, correct: false };

                if (isReviewMode && q.explanation) {
                    const explanationBox = document.getElementById('explanation-box');
                    explanationBox.innerHTML = `⭐ <b>Explanation:</b> ${q.explanation}`;
                    explanationBox.style.display = 'block';
                    
                    // Delay moving forward slightly so they read the explanation
                    setTimeout(() => {
                        reviewQueueIdx++;
                        loadQuestion();
                    }, 4000);
                } else {
                    if (isReviewMode) {
                        reviewQueueIdx++;
                        loadQuestion();
                    } else {
                        currentIdx++;
                        loadQuestion();
                    }
                }
            }
        }

        function updateStreakDisplay() {
            const badge = document.getElementById('streak-badge');
            const count = document.getElementById('streak-count');
            if (streak >= 2) {
                count.innerText = streak;
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }
        }

        function showScorecard() {
            clearInterval(timerInterval);
            document.getElementById('quiz-view').style.display = 'none';
            document.getElementById('scorecard-view').style.display = 'block';
            document.getElementById('streak-badge').style.display = 'none';

            playSound('fanfare');
            triggerBurst(typeof missionConfig !== 'undefined' ? missionConfig.themeIcon : '⭐');

            let correctCount = 0;
            let total = questions.length;

            for (let i = 0; i < total; i++) {
                if (userResponses[i] && userResponses[i].correct) {
                    correctCount++;
                }
            }

            let percentage = Math.round((correctCount / total) * 100);
            document.getElementById('score-summary').innerText = `You got ${correctCount} out of ${total} correct (${percentage}%)!`;

            // Badge & Rank determination
            let badgeEmoji = "🏅";
            let rankName = "Grand Strategist";
            if (percentage === 100) {
                badgeEmoji = "🏆";
                rankName = "Master Problem Solver & Champion Thinker";
            } else if (percentage >= 80) {
                badgeEmoji = "🧠";
                rankName = "Logic Apprentice & High Achiever";
            } else {
                badgeEmoji = "🕵️‍♂️";
                rankName = "Junior Investigator (Ready for Mastery!)";
            }
            document.getElementById('badge-container').innerText = badgeEmoji;
            document.getElementById('rank-title').innerText = rankName;

            // Tailored Inverse Motivational Message
            let msg = "";
            if (percentage < 60) {
                msg = "Fantastic effort! Every challenge and tricky misstep gives your brain extra power and neural pathways. Dive back in to master those tricky spots!";
            } else if (percentage < 90) {
                msg = "Outstanding problem-solving today! You tackled complex logical puzzles like a true professional. Keep up this phenomenal momentum!";
            } else {
                msg = "Absolute perfection! Your sharp focus and deep reasoning skills are truly elite. High-speed success verified!";
            }
            document.getElementById('motivational-message').innerText = msg;

            // Build Scorecard Grid
            const grid = document.getElementById('scorecard-grid');
            grid.innerHTML = '';
            const tbody = document.getElementById('snapshot-tbody');
            tbody.innerHTML = '';

            for (let i = 0; i < total; i++) {
                let resp = userResponses[i];
                let statusClass = 'grid-unanswered';
                let statusText = 'Unanswered';
                let userAnsText = resp ? resp.answer : 'None';

                if (resp) {
                    if (resp.correct) {
                        statusClass = 'grid-correct';
                        statusText = 'Correct';
                    } else {
                        statusClass = 'grid-wrong';
                        statusText = 'Wrong';
                    }
                }

                // Grid cell
                let cell = document.createElement('div');
                cell.className = `grid-item ${statusClass}`;
                cell.innerText = i + 1;
                cell.onclick = () => jumpToQuestion(i);
                grid.appendChild(cell);

                // Snapshot row
                let row = document.createElement('tr');
                row.innerHTML = `
                    <td>#${i + 1}</td>
                    <td style="max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${questions[i].question}">${questions[i].question}</td>
                    <td>${userAnsText}</td>
                    <td style="color: ${resp && resp.correct ? '#4ade80' : '#ef4444'}; font-weight: bold;">${statusText}</td>
                `;
                tbody.appendChild(row);
            }

            // Check if there are missed questions to review
            let missedIndices = [];
            for (let i = 0; i < total; i++) {
                if (!userResponses[i] || !userResponses[i].correct) {
                    missedIndices.push(i);
                }
            }

            const retryBtn = document.getElementById('retry-btn');
            if (missedIndices.length > 0) {
                retryBtn.style.display = 'block';
            } else {
                retryBtn.style.display = 'none';
            }
        }

        function jumpToQuestion(idx) {
            document.getElementById('scorecard-view').style.display = 'none';
            document.getElementById('quiz-view').style.display = 'block';
            isReviewMode = true;
            reviewQueue = [idx];
            reviewQueueIdx = 0;
            loadQuestion();
        }

        function startRetryMode() {
            let missedIndices = [];
            for (let i = 0; i < questions.length; i++) {
                if (!userResponses[i] || !userResponses[i].correct) {
                    missedIndices.push(i);
                }
            }
            if (missedIndices.length === 0) return;

            document.getElementById('scorecard-view').style.display = 'none';
            document.getElementById('quiz-view').style.display = 'block';
            isReviewMode = true;
            reviewQueue = missedIndices;
            reviewQueueIdx = 0;
            loadQuestion();
        }

        function restartMission() {
            window.location.reload();
        }
    </script>
</body>
</html>
