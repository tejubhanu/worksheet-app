<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marty's AI Mission Challenge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body { 
      background-color: #0f172a; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 20px; 
      overflow-x: hidden; 
      position: relative;
      transition: background-color 0.5s ease;
    }

    #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }

    .card { 
      background: rgba(255, 255, 255, 0.95); 
      border-radius: 16px; 
      box-shadow: 0 10px 40px rgba(0,0,0,0.3); 
      width: 100%; 
      max-width: 650px; 
      padding: 30px; 
      position: relative; 
      z-index: 2; 
      color: #1e293b;
    }
    
    .timer-container {
      display: flex; justify-content: space-between; background: #1e293b; color: #38bdf8;
      padding: 8px 15px; border-radius: 8px; font-weight: bold; font-size: 0.95rem;
      margin-bottom: 15px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }

    .header { text-align: center; margin-bottom: 15px; }
    .header h2 { color: #0f172a; margin-bottom: 5px; }
    .header p { color: #64748b; font-weight: bold; }

    .progress-bar { width: 100%; height: 10px; background: #e2e8f0; border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: #22c55e; transition: width 0.3s ease; }
    
    /* Hint & Explanation Styles */
    .hint-container {
      background-color: #fff9c4; border: 2px dashed #fbc02d; color: #574300;
      padding: 12px 16px; border-radius: 12px; font-size: 1.05rem; margin-bottom: 15px; font-weight: 600;
    }

    .explanation-card {
      background-color: #e8f5e9; border: 2px solid #66bb6a; padding: 20px;
      border-radius: 12px; margin-bottom: 20px; text-align: center; font-size: 1.1rem; color: #1b5e20;
    }
    
    .question-box { font-size: 1.25rem; font-weight: 600; color: #0f172a; margin-bottom: 20px; line-height: 1.4; }
    .options-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .option-btn { padding: 12px 16px; border: 2px solid #cbd5e1; background: #f8fafc; border-radius: 8px; font-size: 1rem; cursor: pointer; text-align: left; transition: all 0.2s ease; }
    .option-btn:hover { border-color: #38bdf8; background: #e0f2fe; }
    .option-btn.selected { border-color: #0284c7; background: #bae6fd; font-weight: bold; }
    .input-box { width: 100%; padding: 12px; font-size: 1rem; border: 2px solid #cbd5e1; border-radius: 8px; margin-bottom: 20px; }
    
    .nav-buttons { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }
    .btn { padding: 10px 20px; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .btn-prev { background: #94a3b8; color: white; }
    .btn-next { background: #0284c7; color: white; }
    .btn-submit { background: #16a34a; color: white; }
    .btn-retry { background: #f59e0b; color: white; width: 100%; margin-top: 15px; padding: 15px; font-size: 1.1rem;}
    
    .scorecard-container { display: flex; flex-direction: column; gap: 15px; margin: 20px 0; }
    .scorecard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; }
    .score-box { padding: 10px 0; text-align: center; font-weight: bold; border-radius: 6px; color: white; transition: transform 0.1s ease; border: 2px solid transparent; }
    
    /* Correct is locked, Incorrect is clickable */
    .score-correct { background-color: #16a34a; pointer-events: none; }
    .score-wrong { background-color: #dc2626; cursor: pointer; }
    .score-unanswered { background-color: #94a3b8; cursor: pointer; }
    .score-wrong:hover, .score-unanswered:hover { transform: scale(1.05); border-color: #333; }
    
    .motivational-msg { margin-top: 20px; padding: 15px; background: #fef3c7; border-left: 5px solid #f59e0b; border-radius: 4px; font-size: 1.1rem; color: #92400e; font-weight: bold; }

    #anim-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.95); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
    #anim-canvas { background: #1e293b; border-radius: 12px; border: 2px solid #38bdf8; box-shadow: 0 0 30px rgba(33, 150, 243, 0.4); }
    .anim-text { margin-top: 20px; font-size: 1.4rem; font-weight: bold; color: #38bdf8; text-transform: uppercase; text-align: center; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="anim-overlay" class="hidden">
  <canvas id="anim-canvas" width="500" height="350"></canvas>
  <div class="anim-text" id="anim-status-text">Processing...</div>
</div>

<div class="card">
  
  <div class="timer-container">
    <div>⏱️ Mission Time: <span id="global-timer">00:00</span></div>
    <div>⏳ Question Time: <span id="question-timer">00:00</span></div>
  </div>

  <div class="header">
    <h2 id="title">Mission Challenge</h2>
    <p id="step-indicator">Question 1 of 1</p>
  </div>
  
  <div class="progress-bar">
    <div class="progress-fill" id="progress"></div>
  </div>

  <div id="quiz-container">
    
    <div id="hint-box" class="hint-container hidden"></div>
    <div id="explanation-modal" class="explanation-card hidden">
      <div id="explanation-text" style="margin-bottom: 15px;"></div>
      <button class="btn btn-next" onclick="nextRetryAfterExplanation()">Got It! Next Question ➡️</button>
    </div>

    <div id="question-wrapper">
      <div class="question-box" id="question-text">Loading question...</div>
      <div id="answer-container"></div>

      <div class="nav-buttons" id="standard-nav">
        <button class="btn btn-prev" id="prev-btn" onclick="changeQuestion(-1)">Previous</button>
        <button class="btn btn-next" id="next-btn" onclick="handleNextClick()">Next</button>
        <button class="btn btn-submit hidden" id="submit-btn" onclick="triggerFactoryAnimation('finish')">Complete Mission</button>
      </div>

      <div class="nav-buttons hidden" id="retry-nav">
        <button class="btn btn-next" style="width:100%;" onclick="submitRetryAnswer()">Check My Answer</button>
      </div>
    </div>
  </div>

  <div id="result-container" class="hidden" style="text-align: center;">
    <h2>🎖️ Mission Status Report</h2>
    <p style="font-size: 1.2rem; margin: 15px 0;" id="score-display"></p>
    
    <div class="scorecard-container">
      <div class="scorecard-grid" id="scorecard-grid"></div>
    </div>
    
    <div id="motivational-message" class="motivational-msg"></div>

    <button id="retry-btn" class="btn btn-retry hidden" onclick="startRetryMode()">🧩 Review & Try Missed Questions</button>
    
    <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
      <button class="btn btn-prev" onclick="restartQuiz()">Restart Entire Mission</button>
    </div>
  </div>
</div>

<script src="questions.js"></script>

<script>
  // Apply Dynamic Theme
  document.body.style.backgroundColor = missionConfig.themeColor || "#0f172a";
  document.getElementById("title").innerText = missionConfig.themeTitle || "Mission";
  const themeIcon = missionConfig.themeIcon || "🤖";
  const questions = missionConfig.questions;

  // State Variables
  let currentIdx = 0;
  let userAnswers = new Array(questions.length).fill(null);
  let missionCompleted = false;
  
  // Retry Logic State
  let missedQuestions = [];
  let retryIndex = 0;
  let isRetryMode = false;

  // Timers
  let globalSeconds = 0;
  let questionSeconds = 0;
  let globalTimerInt, questionTimerInt;

  function formatTime(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = (sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function startTimers() {
    clearInterval(globalTimerInt);
    clearInterval(questionTimerInt);
    globalTimerInt = setInterval(() => {
      globalSeconds++;
      document.getElementById("global-timer").innerText = formatTime(globalSeconds);
    }, 1000);
    questionTimerInt = setInterval(() => {
      questionSeconds++;
      document.getElementById("question-timer").innerText = formatTime(questionSeconds);
    }, 1000);
  }

  function loadQuestion() {
    questionSeconds = 0; 
    document.getElementById("question-timer").innerText = "00:00";
    
    const activeIdx = isRetryMode ? missedQuestions[retryIndex] : currentIdx;
    const q = questions[activeIdx];
    
    if(isRetryMode) {
      document.getElementById("step-indicator").innerText = `Reviewing Missed Question ${retryIndex + 1} of ${missedQuestions.length}`;
      document.getElementById("progress").style.width = `${((retryIndex + 1) / missedQuestions.length) * 100}%`;
    } else {
      document.getElementById("step-indicator").innerText = `Question ${currentIdx + 1} of ${questions.length}`;
      document.getElementById("progress").style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
    }

    document.getElementById("question-text").innerHTML = q.question.replace(/\n/g, '<br>');

    // UI Resets
    const container = document.getElementById("answer-container");
    container.innerHTML = "";
    document.getElementById("explanation-modal").classList.add("hidden");
    document.getElementById("question-wrapper").classList.remove("hidden");

    // Show Hint in Retry Mode
    if (isRetryMode) {
      const hintBox = document.getElementById("hint-box");
      hintBox.innerHTML = `<strong>Need a clue?</strong> ${q.hint}`;
      hintBox.classList.remove("hidden");
      document.getElementById("standard-nav").classList.add("hidden");
      document.getElementById("retry-nav").classList.remove("hidden");
    } else {
      document.getElementById("hint-box").classList.add("hidden");
      document.getElementById("standard-nav").classList.remove("hidden");
      document.getElementById("retry-nav").classList.add("hidden");
    }

    // Input Generation
    if (q.type === "mcq") {
      const optsDiv = document.createElement("div");
      optsDiv.className = "options-container";
      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn" + (userAnswers[activeIdx] === opt ? " selected" : "");
        btn.innerText = opt;
        btn.onclick = () => selectOption(opt);
        optsDiv.appendChild(btn);
      });
      container.appendChild(optsDiv);
    } else if (q.type === "text") {
      const input = document.createElement("input");
      input.type = "text";
      input.className = "input-box";
      input.placeholder = "Type your answer here...";
      input.value = userAnswers[activeIdx] || "";
      input.oninput = (e) => { userAnswers[activeIdx] = e.target.value.trim(); };
      container.appendChild(input);
    }

    // Standard Nav Logic
    if (!isRetryMode) {
      document.getElementById("prev-btn").disabled = currentIdx === 0;
      if (currentIdx === questions.length - 1) {
        document.getElementById("next-btn").classList.add("hidden");
        document.getElementById("submit-btn").classList.remove("hidden");
      } else {
        document.getElementById("next-btn").classList.remove("hidden");
        document.getElementById("submit-btn").classList.add("hidden");
      }
    }
  }

  function selectOption(val) {
    const activeIdx = isRetryMode ? missedQuestions[retryIndex] : currentIdx;
    userAnswers[activeIdx] = val;
    loadQuestion();
  }

  function changeQuestion(dir) {
    if (currentIdx + dir >= 0 && currentIdx + dir < questions.length) {
      currentIdx += dir;
      loadQuestion();
    }
  }

  function handleNextClick() {
    runCustomAnimation("quick", () => {
      changeQuestion(1);
    });
  }

  // --- RETRY MODE LOGIC ---
  function startRetryMode() {
    if(missedQuestions.length === 0) return;
    isRetryMode = true;
    retryIndex = 0;
    document.getElementById('result-container').classList.add('hidden');
    document.getElementById('quiz-container').classList.remove('hidden');
    
    // Resume global timer for retry session
    clearInterval(globalTimerInt);
    globalTimerInt = setInterval(() => {
      globalSeconds++;
      document.getElementById("global-timer").innerText = formatTime(globalSeconds);
    }, 1000);
    
    loadQuestion();
  }
  
  // Directly jump to a specific missed question from the scorecard
  function jumpToRetryQuestion(globalIdx) {
    const missedIdx = missedQuestions.indexOf(globalIdx);
    if (missedIdx !== -1) {
      isRetryMode = true;
      retryIndex = missedIdx;
      document.getElementById("result-container").classList.add("hidden");
      document.getElementById("quiz-container").classList.remove("hidden");
      
      clearInterval(globalTimerInt);
      globalTimerInt = setInterval(() => {
        globalSeconds++;
        document.getElementById("global-timer").innerText = formatTime(globalSeconds);
      }, 1000);
      
      loadQuestion();
    }
  }

  function submitRetryAnswer() {
    const activeIdx = missedQuestions[retryIndex];
    const q = questions[activeIdx];
    const ans = userAnswers[activeIdx];

    if (ans && ans.toLowerCase() === q.answer.toLowerCase()) {
      alert("🎉 Awesome job thinking it through! You got it right!");
      retryIndex++;
      if (retryIndex < missedQuestions.length) {
        loadQuestion();
      } else {
        finishRetryMode();
      }
    } else {
      // Failed retry -> Show Explanation
      document.getElementById("question-wrapper").classList.add("hidden");
      document.getElementById("explanation-modal").classList.remove("hidden");
      // Format markdown-like bolding for the explanation text
      let explHTML = q.explanation.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
      document.getElementById("explanation-text").innerHTML = `<h3>Nice try! Let's learn together:</h3><br><p>${explHTML}</p>`;
    }
  }

  function nextRetryAfterExplanation() {
    retryIndex++;
    if (retryIndex < missedQuestions.length) {
      loadQuestion();
    } else {
      finishRetryMode();
    }
  }

  function finishRetryMode() {
    clearInterval(globalTimerInt);
    clearInterval(questionTimerInt);
    isRetryMode = false;
    alert("🌟 Great effort! You completed your review mission.");
    
    missedQuestions = []; 
    generateScorecard(); 
  }

  // --- ANIMATION ENGINE ---
  function triggerFactoryAnimation(mode) {
    clearInterval(globalTimerInt);
    clearInterval(questionTimerInt);
    runCustomAnimation("boss", () => {
      generateScorecard();
    });
  }

  function runCustomAnimation(mode, onComplete) {
    const overlay = document.getElementById("anim-overlay");
    const canvas = document.getElementById("anim-canvas");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("anim-status-text");
    
    overlay.classList.remove("hidden");
    let frame = 0;
    let durationFrames = mode === 'quick' ? 90 : 300;
    
    statusText.innerText = mode === 'quick' ? "Loading Next Phase..." : "Epic Battle Commencing!";
    
    let particles = [];
    let numParticles = mode === 'quick' ? 3 : 15;
    
    for(let i=0; i<numParticles; i++) {
      particles.push({
        x: mode === 'quick' ? -50 : canvas.width / 2,
        y: mode === 'quick' ? 50 + (i * 80) : canvas.height / 2,
        vx: mode === 'quick' ? 5 + Math.random()*3 : (Math.random() - 0.5) * 6,
        vy: mode === 'quick' ? 0 : (Math.random() - 0.5) * 6,
        size: 30 + Math.random() * 20,
        rotation: 0,
        spin: (Math.random() - 0.5) * 0.15
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = "center"; ctx.textBaseline = "middle";

      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.rotation += p.spin;
        if(mode === 'boss') {
          if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
          if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
        }
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rotation);
        ctx.font = p.size + "px Arial";
        ctx.fillText(themeIcon, 0, 0);
        ctx.restore();
      });

      frame++;
      if (mode === 'boss') {
        if (frame === 100) statusText.innerText = "Clashing Powers!";
        if (frame === 200) statusText.innerText = "Analyzing Results...";
      }

      if (frame < durationFrames) requestAnimationFrame(draw);
      else setTimeout(() => { overlay.classList.add("hidden"); onComplete(); }, 200);
    }
    draw();
  }

  // Adjusted Inverse Motivation Logic
  function getMotivationalMessage(score, total) {
    const pct = score / total;
    if (pct < 0.6) {
      return "WOOHOO! 🚀 This is EXACTLY where real engineers level up! You've uncovered an amazing opportunity to train your brain. Explorer Team Alpha is cheering you on—let's dive into these tricky puzzles and smash them!";
    } else if (pct < 1) {
      return "Great work today! You successfully navigated most of the missions. Just a few final adjustments needed for your telemetry data. You've got this!";
    } else {
      return "Mission accomplished. Solid engineering work today. Telemetry is 100% stable.";
    }
  }

  function generateScorecard() {
    missionCompleted = true;
    let score = 0;
    missedQuestions = []; 
    const grid = document.getElementById("scorecard-grid");
    grid.innerHTML = "";

    questions.forEach((q, i) => {
      const ans = userAnswers[i];
      const isAnswered = ans !== null && ans !== "";
      const isCorrect = isAnswered && ans.toLowerCase() === q.answer.toLowerCase();

      if (isCorrect) {
        score++;
      } else {
        missedQuestions.push(i);
      }

      const box = document.createElement("div");
      if (isCorrect) {
        box.className = "score-box score-correct";
      } else {
        box.className = "score-box " + (isAnswered ? "score-wrong" : "score-unanswered");
        box.onclick = () => jumpToRetryQuestion(i);
        box.title = "Click to retry this mission!";
      }
      box.innerText = `Q${i + 1}`;
      grid.appendChild(box);
    });

    document.getElementById("score-display").innerText = `Score: ${score} / ${questions.length} | Time: ${formatTime(globalSeconds)}`;
    
    if (missedQuestions.length > 0) {
      document.getElementById("retry-btn").classList.remove("hidden");
      document.getElementById("motivational-message").innerText = getMotivationalMessage(score, questions.length);
    } else {
      document.getElementById("retry-btn").classList.add("hidden");
      document.getElementById("motivational-message").innerText = "Review Complete! You fixed all the errors in your telemetry data!";
    }

    document.getElementById("quiz-container").classList.add("hidden");
    document.getElementById("result-container").classList.remove("hidden");
  }

  function restartQuiz() {
    if(confirm("Are you sure you want to clear all your answers and restart?")) {
      currentIdx = 0;
      globalSeconds = 0;
      userAnswers = new Array(questions.length).fill(null);
      missionCompleted = false;
      isRetryMode = false;
      missedQuestions = [];
      document.getElementById("result-container").classList.add("hidden");
      document.getElementById("quiz-container").classList.remove("hidden");
      startTimers();
      loadQuestion();
    }
  }

  // Start everything
  startTimers();
  loadQuestion();
</script>
</body>
</html>
