<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marty's AI Mission Challenge: Robot Factory Repair</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { 
      background-color: #0f172a; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 20px; 
      overflow-x: hidden; 
      position: relative;
    }

    /* Animated Circuit Board Background Canvas */
    #bg-canvas {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    .card { 
      background: rgba(30, 41, 59, 0.95); 
      border: 2px solid #38bdf8;
      border-radius: 16px; 
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.25); 
      width: 100%; 
      max-width: 650px; 
      padding: 30px; 
      position: relative; 
      z-index: 2; 
      color: #f8fafc;
    }
    .header { text-align: center; margin-bottom: 20px; }
    .header h2 { color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    .header p { color: #94a3b8; }

    .progress-bar { width: 100%; height: 10px; background: #334155; border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: #22c55e; transition: width 0.3s ease; box-shadow: 0 0 10px #22c55e; }
    
    .question-box { font-size: 1.25rem; font-weight: 600; color: #f1f5f9; margin-bottom: 20px; line-height: 1.4; }
    
    .options-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .option-btn { padding: 12px 16px; border: 2px solid #475569; background: #1e293b; color: #f8fafc; border-radius: 8px; font-size: 1rem; cursor: pointer; text-align: left; transition: all 0.2s ease; }
    .option-btn:hover { border-color: #38bdf8; background: #334155; }
    .option-btn.selected { border-color: #38bdf8; background: #0369a1; font-weight: bold; box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
    
    .input-box { width: 100%; padding: 12px; font-size: 1rem; border: 2px solid #475569; background: #0f172a; color: white; border-radius: 8px; margin-bottom: 20px; }
    .input-box:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }

    .nav-buttons { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }
    .btn { padding: 10px 20px; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .btn-prev { background: #64748b; color: white; }
    .btn-prev:hover { background: #475569; }
    .btn-next { background: #0284c7; color: white; }
    .btn-next:hover { background: #0284c7; box-shadow: 0 0 10px #0284c7; }
    .btn-submit { background: #16a34a; color: white; }
    .btn-submit:hover { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
    .btn-summary { background: #7c3aed; color: white; width: 100%; margin-top: 10px; }
    .btn-summary:hover { background: #8b5cf6; box-shadow: 0 0 10px #8b5cf6; }
    
    /* Scorecard Styles */
    .scorecard-container { display: flex; flex-direction: column; gap: 15px; margin: 20px 0; }
    .scorecard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; }
    .score-box { padding: 10px 0; text-align: center; font-weight: bold; border-radius: 6px; cursor: pointer; color: white; transition: transform 0.1s ease; border: 2px solid transparent; }
    .score-box:hover { transform: scale(1.05); border-color: white; }
    .score-correct { background-color: #16a34a; }
    .score-wrong { background-color: #dc2626; }
    .score-unanswered { background-color: #64748b; }
    
    .legend { display: flex; justify-content: center; gap: 15px; font-size: 0.9rem; margin-bottom: 10px; font-weight: 600; color: #cbd5e1; }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; }

    /* Animation Overlay Styles */
    #anim-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.95);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
    }
    #anim-canvas { background: #1e293b; border-radius: 12px; border: 2px solid #38bdf8; box-shadow: 0 0 30px rgba(33, 150, 243, 0.4); }
    .anim-text { margin-top: 20px; font-size: 1.4rem; font-weight: bold; letter-spacing: 1px; color: #38bdf8; text-transform: uppercase; text-align: center; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- Animated Background Canvas -->
<canvas id="bg-canvas"></canvas>

<!-- Animation Overlay Screen -->
<div id="anim-overlay" class="hidden">
  <canvas id="anim-canvas" width="450" height="300"></canvas>
  <div class="anim-text" id="anim-status-text">Processing Telemetry...</div>
</div>

<div class="card">
  <!-- Progress Header -->
  <div class="header">
    <h2 id="title">🤖 Mission: Robot Factory Repair</h2>
    <p id="step-indicator">Question 1 of 35</p>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progress"></div>
  </div>

  <!-- Question Section -->
  <div id="quiz-container">
    <div class="question-box" id="question-text">Loading question...</div>
    <div id="answer-container"></div>

    <!-- Navigation -->
    <div class="nav-buttons">
      <button class="btn btn-prev" id="prev-btn" onclick="changeQuestion(-1)">Previous</button>
      <button class="btn btn-next" id="next-btn" onclick="handleNextClick()">Next</button>
      <button class="btn btn-submit hidden" id="submit-btn" onclick="triggerFactoryAnimation('finish')">Finish Mission</button>
    </div>
    <button class="btn btn-summary hidden" id="back-summary-btn" onclick="showScorecard()">Back to Scorecard</button>
  </div>

  <!-- Completion / Scorecard Section -->
  <div id="result-container" class="hidden" style="text-align: center;">
    <h2>🎖️ Mission Status Report</h2>
    <p style="font-size: 1.2rem; margin: 15px 0;" id="score-display"></p>
    
    <div class="legend">
      <span><div class="legend-dot" style="background: #16a34a;"></div> Correct</span>
      <span><div class="legend-dot" style="background: #dc2626;"></div> Wrong</span>
      <span><div class="legend-dot" style="background: #64748b;"></div> Empty</span>
    </div>

    <div class="scorecard-container">
      <div class="scorecard-grid" id="scorecard-grid"></div>
    </div>

    <p style="font-size: 1rem; color: #94a3b8; margin-bottom: 20px;">Click any question above to re-visit and correct your telemetry data!</p>
    
    <div style="display: flex; gap: 10px; justify-content: center;">
      <button class="btn btn-next" onclick="restartQuiz()">Restart Entire Mission</button>
      <button class="btn btn-submit" id="final-lock-btn" onclick="triggerFactoryAnimation('lock')">Lock Answers</button>
    </div>
  </div>
</div>

<script>
  // Background Circuit Lines Animation Setup
  const bgCanvas = document.getElementById('bg-canvas');
  const bgCtx = bgCanvas.getContext('2d');
  function resizeBg() {
    bgCanvas.width = window.innerWidth;
    bgCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeBg);
  resizeBg();

  let nodes = [];
  for(let i=0; i<40; i++) {
    nodes.push({
      x: Math.random() * bgCanvas.width,
      y: Math.random() * bgCanvas.height,
      vx: (Math.random() - 0.5) * 0.6,
      vy: (Math.random() - 0.5) * 0.6
    });
  }

  function animateBg() {
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    bgCtx.strokeStyle = 'rgba(56, 189, 248, 0.12)';
    bgCtx.fillStyle = 'rgba(56, 189, 248, 0.3)';
    bgCtx.lineWidth = 1.5;

    for(let i=0; i<nodes.length; i++) {
      let n = nodes[i];
      n.x += n.vx;
      n.y += n.vy;
      if(n.x < 0 || n.x > bgCanvas.width) n.vx *= -1;
      if(n.y < 0 || n.y > bgCanvas.height) n.vy *= -1;

      bgCtx.beginPath();
      bgCtx.arc(n.x, n.y, 2.5, 0, Math.PI * 2);
      bgCtx.fill();

      for(let j=i+1; j<nodes.length; j++) {
        let n2 = nodes[j];
        let dist = Math.hypot(n.x - n2.x, n.y - n2.y);
        if(dist < 120) {
          bgCtx.beginPath();
          bgCtx.moveTo(n.x, n.y);
          bgCtx.lineTo(n2.x, n2.y);
          bgCtx.stroke();
        }
      }
    }
    requestAnimationFrame(animateBg);
  }
  animateBg();

  // Questions Database
  const questions = [
    { type: "text", question: "1. Robot Alpha needs 45 gear teeth. It has 28. How many more does it need?", answer: "17" },
    { type: "text", question: "2. 36 chips in the morning + 29 chips in the afternoon = _____ total chips", answer: "65" },
    { type: "text", question: "3. 84 bolts minus 37 rusty bolts leaves _____ clean bolts", answer: "47" },
    { type: "text", question: "4. Double 18 power cells = _____ total capacity", answer: "36" },
    { type: "text", question: "5. Half of a 52-unit battery charge = _____ units", answer: "26" },
    { type: "text", question: "6. 7 × 4 solar panels = _____ total panels", answer: "28" },
    { type: "text", question: "7. 6 × 5 microchips = _____ total microchips", answer: "30" },
    { type: "text", question: "8. 9 × 3 sensor beams = _____ total sensor beams", answer: "27" },
    { type: "text", question: "9. 63 - 19 energy spheres = _____", answer: "44" },
    { type: "text", question: "10. 58 + 26 circuit wire spools = _____", answer: "84" },
    { type: "text", question: "11. Complete the circuit frequency pattern: 4, 9, 14, 19, _____, 29", answer: "24" },
    { type: "text", question: "12. Complete the sensor pulse sequence: 3, 6, 12, 24, _____", answer: "48" },
    { type: "mcq", question: "13. Gear Rotation: [CW, CW, CCW, CW, CW, CCW...]. What is the 14th rotation?", options: ["CW", "CCW"], answer: "CW" },
    { type: "mcq", question: "14. Which serial number does NOT belong? [14, 21, 28, 35, 40, 49]", options: ["28", "35", "40", "49"], answer: "40" },
    { type: "text", question: "15. Lamp A flashes every 2 sec, Lamp B every 3 sec. Next flash together at: _____ sec", answer: "6" },
    { type: "text", question: "16. Password code sequence: A ➔ D ➔ G ➔ J ➔ _____ (Type the next letter)", answer: "M" },
    { type: "text", question: "17. Voltage step sequence: 100, 91, 82, 73, _____", answer: "64" },
    { type: "text", question: "18. Memory chip storage: 1, 4, 9, 16, 25, _____", answer: "36" },
    { type: "text", question: "19. A laser beam hits a mirror at 30°. It reflects at 30°. If turned 15° more, the new angle of reflection is _____°", answer: "45" },
    { type: "text", question: "20. A lever pushes with 10 lbs of force on a 4-foot lever arm. Total torque = _____ ft-lbs", answer: "40" },
    { type: "text", question: "21. Coolant liquid is at 38°C and boils at 100°C. Degrees remaining until boiling: _____°C", answer: "62" },
    { type: "text", question: "22. Three 6-Volt batteries connected in series (+ to -) produce _____ Volts total", answer: "18" },
    { type: "text", question: "23. Gravity on Planet Robo is half of Earth's. Robot Bolt is 84 kg on Earth. On Robo it weighs _____ kg", answer: "42" },
    { type: "text", question: "24. Solar panels convert 20% of sunlight into power. 500 Watts of sunlight yields _____ Watts", answer: "100" },
    { type: "text", question: "25. Gear A (10 teeth) turns 6 full times, driving Gear B (30 teeth). Gear B turns _____ times", answer: "2" },
    { type: "mcq", question: "26. CLUES: Four Robots (Robo-A, Robo-B, Robo-C, Robo-D) have four jobs: Welder, Painter, Inspector, Navigator.\n• Robo-A is NOT the Painter and NOT the Navigator.\n• Robo-B is the Inspector.\n• Robo-C avoids paint fumes.\n• Robo-D's task starts with the letter 'P'.\n\nWhich robot is the Inspector?", options: ["Robo-A", "Robo-B", "Robo-C", "Robo-D"], answer: "Robo-B" },
    { type: "mcq", question: "27. Based on the clues in the previous question, which robot is the Painter?", options: ["Robo-A", "Robo-B", "Robo-C", "Robo-D"], answer: "Robo-D" },
    { type: "mcq", question: "28. Based on the same clues, which robot is the Navigator?", options: ["Robo-A", "Robo-B", "Robo-C", "Robo-D"], answer: "Robo-C" },
    { type: "mcq", question: "29. Based on the same clues, which robot is the Welder?", options: ["Robo-A", "Robo-B", "Robo-C", "Robo-D"], answer: "Robo-A" },
    { type: "text", question: "30. If the Welder works 4 hrs/day and the Inspector works 6 hrs/day, how many hours do both work combined in 5 days?", answer: "50" },
    { type: "text", question: "31. Function Machine: [Input] ➔ [× 4] ➔ [- 7] ➔ [Output]. Input = 8, Output = _____", answer: "25" },
    { type: "text", question: "32. Inverse Machine: [Input] ➔ [× 3] ➔ [+ 5] ➔ Output: 26. Input = _____", answer: "7" },
    { type: "text", question: "33. Alpha charges at 15%/hr. Beta charges at 25%/hr. After 3 hours, Beta is _____% ahead of Alpha.", answer: "30" },
    { type: "mcq", question: "34. A lift holds up to 200 kg. Can it hold 3 bots (45 kg each) + a 55 kg toolbox?", options: ["YES", "NO"], answer: "YES" },
    { type: "text", question: "35. BOSS BATTLE: Find the 4-Digit Master Code [W, X, Y, Z]:\n• Clue 1: All digits are distinct single digits (1-9).\n• Clue 2: W + X + Y + Z = 20.\n• Clue 3: W is the smallest prime number.\n• Clue 4: X is 3 times W.\n• Clue 5: Y is an odd square number.\n\nType the final 4-digit code:", answer: "2693" }
  ];

  let currentIdx = 0;
  let userAnswers = new Array(questions.length).fill(null);
  let missionCompleted = false;

  function loadQuestion() {
    const q = questions[currentIdx];
    document.getElementById("step-indicator").innerText = `Question ${currentIdx + 1} of ${questions.length}`;
    document.getElementById("question-text").innerHTML = q.question.replace(/\n/g, '<br>');
    document.getElementById("progress").style.width = `${((currentIdx + 1) / questions.length) * 100}%`;

    const container = document.getElementById("answer-container");
    container.innerHTML = "";

    if (q.type === "mcq") {
      const optsDiv = document.createElement("div");
      optsDiv.className = "options-container";
      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn" + (userAnswers[currentIdx] === opt ? " selected" : "");
        btn.innerText = opt;
        btn.onclick = () => selectOption(opt);
        optsDiv.appendChild(btn);
      });
      container.appendChild(optsDiv);
    } else if (q.type === "text") {
      const input = document.createElement("input");
      input.type = "text";
      input.className = "input-box";
      input.placeholder = "Type your answer here...";
      input.value = userAnswers[currentIdx] || "";
      input.oninput = (e) => { userAnswers[currentIdx] = e.target.value.trim(); };
      container.appendChild(input);
    }

    document.getElementById("prev-btn").disabled = currentIdx === 0;
    
    if (currentIdx === questions.length - 1) {
      document.getElementById("next-btn").classList.add("hidden");
      document.getElementById("submit-btn").classList.remove("hidden");
    } else {
      document.getElementById("next-btn").classList.remove("hidden");
      document.getElementById("submit-btn").classList.add("hidden");
    }

    if (missionCompleted) {
      document.getElementById("back-summary-btn").classList.remove("hidden");
    } else {
      document.getElementById("back-summary-btn").classList.add("hidden");
    }
  }

  function selectOption(val) {
    userAnswers[currentIdx] = val;
    loadQuestion();
  }

  function changeQuestion(dir) {
    if (currentIdx + dir >= 0 && currentIdx + dir < questions.length) {
      currentIdx += dir;
      loadQuestion();
    }
  }

  function handleNextClick() {
    runQuickAnimation("Saving Telemetry...", () => {
      changeQuestion(1);
    });
  }

  function triggerFactoryAnimation(mode) {
    let messages = [];
    let onComplete = null;

    if (mode === 'finish') {
      messages = ["Scanning Telemetry Inputs...", "Welding Logic Circuits...", "Generating Mission Status Report..."];
      onComplete = () => generateScorecard();
    } else if (mode === 'lock') {
      messages = ["Locking Current Answers...", "Synchronizing Data Matrix...", "Telemetry Successfully Secure!"];
      onComplete = () => alert("Telemetry Locked! Great job, Explorer Team Alpha!");
    }

    runCustomAnimation(messages, 130, onComplete);
  }

  function runQuickAnimation(textMsg, onComplete) {
    runCustomAnimation([textMsg, "Loading Next Circuit..."], 45, onComplete);
  }

  function runCustomAnimation(statusMessages, durationFrames, onComplete) {
    const overlay = document.getElementById("anim-overlay");
    const canvas = document.getElementById("anim-canvas");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("anim-status-text");
    
    overlay.classList.remove("hidden");
    
    let frame = 0;
    statusText.innerText = statusMessages[0];

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#334155";
      ctx.fillRect(0, 220, canvas.width, 20);
      ctx.fillStyle = "#64748b";
      for (let i = (frame * 3) % 30; i < canvas.width; i += 30) {
        ctx.fillRect(i, 225, 15, 10);
      }

      let robotX = 225;
      let robotY = 160 + Math.sin(frame * 0.1) * 3;
      
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(robotX - 25, robotY, 50, 45);
      ctx.fillStyle = frame % 20 < 10 ? "#facc15" : "#ef4444";
      ctx.fillRect(robotX - 15, robotY + 10, 8, 8);
      ctx.fillRect(robotX + 7, robotY + 10, 8, 8);
      
      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(robotX, robotY);
      ctx.lineTo(robotX, robotY - 15);
      ctx.stroke();
      ctx.fillStyle = "#22c55e";
      ctx.beginPath();
      ctx.arc(robotX, robotY - 18, 5, 0, Math.PI * 2);
      ctx.fill();

      let armX = 100 + (frame * 4) % 250;
      ctx.strokeStyle = "#cbd5e1";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(armX, 40);
      ctx.lineTo(armX, 120);
      ctx.stroke();

      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(armX, 120);
      ctx.lineTo(robotX, robotY);
      ctx.stroke();

      if (frame % 5 === 0) {
        ctx.fillStyle = "#facc15";
        for (let s = 0; s < 4; s++) {
          ctx.fillRect(robotX + (Math.random() * 30 - 15), robotY + (Math.random() * 30 - 15), 4, 4);
        }
      }

      frame++;
      
      if (statusMessages.length > 1) {
        if (frame === Math.floor(durationFrames / 3)) {
          statusText.innerText = statusMessages[1];
        } else if (frame === Math.floor((durationFrames / 3) * 2) && statusMessages.length > 2) {
          statusText.innerText = statusMessages[2];
        }
      }

      if (frame < durationFrames) {
        requestAnimationFrame(draw);
      } else {
        setTimeout(() => {
          overlay.classList.add("hidden");
          onComplete();
        }, 200);
      }
    }

    draw();
  }

  function generateScorecard() {
    missionCompleted = true;
    let score = 0;
    const grid = document.getElementById("scorecard-grid");
    grid.innerHTML = "";

    questions.forEach((q, i) => {
      const answerGiven = userAnswers[i];
      const isAnswered = answerGiven !== null && answerGiven !== "";
      const isCorrect = isAnswered && answerGiven.toLowerCase() === q.answer.toLowerCase();

      if (isCorrect) score++;

      const box = document.createElement("div");
      if (isCorrect) {
        box.className = "score-box score-correct";
      } else if (isAnswered) {
        box.className = "score-box score-wrong";
      } else {
        box.className = "score-box score-unanswered";
      }
      
      box.innerText = `Q${i + 1}`;
      box.title = isCorrect ? "Correct!" : (isAnswered ? "Incorrect - Click to review" : "Unanswered - Click to answer");
      box.onclick = () => jumpToQuestion(i);
      
      grid.appendChild(box);
    });

    document.getElementById("score-display").innerText = `Current Score: ${score} out of ${questions.length}`;
    showScorecard();
  }

  function showScorecard() {
    if(missionCompleted) generateScorecardUIOnly(); 
    document.getElementById("quiz-container").classList.add("hidden");
    document.getElementById("result-container").classList.remove("hidden");
  }

  function generateScorecardUIOnly() {
    let score = 0;
    const grid = document.getElementById("scorecard-grid");
    grid.innerHTML = "";
    questions.forEach((q, i) => {
      const answerGiven = userAnswers[i];
      const isAnswered = answerGiven !== null && answerGiven !== "";
      const isCorrect = isAnswered && answerGiven.toLowerCase() === q.answer.toLowerCase();
      if (isCorrect) score++;
      const box = document.createElement("div");
      if (isCorrect) box.className = "score-box score-correct";
      else if (isAnswered) box.className = "score-box score-wrong";
      else box.className = "score-box score-unanswered";
      box.innerText = `Q${i + 1}`;
      box.onclick = () => jumpToQuestion(i);
      grid.appendChild(box);
    });
    document.getElementById("score-display").innerText = `Current Score: ${score} out of ${questions.length}`;
  }

  function jumpToQuestion(index) {
    currentIdx = index;
    document.getElementById("result-container").classList.add("hidden");
    document.getElementById("quiz-container").classList.remove("hidden");
    loadQuestion();
  }

  function restartQuiz() {
    if(confirm("Are you sure you want to clear all your answers and start over?")) {
      currentIdx = 0;
      userAnswers = new Array(questions.length).fill(null);
      missionCompleted = false;
      document.getElementById("result-container").classList.add("hidden");
      document.getElementById("quiz-container").classList.remove("hidden");
      loadQuestion();
    }
  }

  loadQuestion();
</script>
</body>
</html>
